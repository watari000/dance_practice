<html lang="ja">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2308090d'/%3E%3Cstop offset='50%25' stop-color='%23121520'/%3E%3Cstop offset='100%25' stop-color='%231a0b2e'/%3E%3C/linearGradient%3E%3ClinearGradient id='neon1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f2fe'/%3E%3Cstop offset='100%25' stop-color='%237000ff'/%3E%3C/linearGradient%3E%3ClinearGradient id='neon2' x1='0%25' y1='0%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2300ff87'/%3E%3Cstop offset='100%25' stop-color='%2360efff'/%3E%3C/linearGradient%3E%3Cfilter id='glow' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeGaussianBlur stdDeviation='12' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)'/%3E%3Crect x='6' y='6' width='500' height='500' rx='114' fill='none' stroke='url(%23neon1)' stroke-width='4' opacity='0.4'/%3E%3Cpath d='M80 400 L120 400 M140 400 L160 400 M350 400 L370 400 M390 400 L430 400' stroke='url(%23neon1)' stroke-width='6' stroke-linecap='round' opacity='0.3'/%3E%3Cg filter='url(%23glow)'%3E%3Cpath d='M 120 380 Q 200 340 256 360 T 390 320' fill='none' stroke='url(%23neon2)' stroke-width='8' stroke-linecap='round' opacity='0.7'/%3E%3Cpath d='M-30 0 L10 20 L20 -10' transform='translate(380,310) rotate(15)' fill='none' stroke='url(%23neon2)' stroke-width='6' stroke-linecap='round'/%3E%3Cg transform='translate(256, 240)' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='20' cy='-110' r='24' fill='url(%23neon1)' stroke='none'/%3E%3Cpath d='M-10 -75 L20 -50 L70 -80 M20 -50 L50 -20 L90 -10' stroke='url(%23neon1)' stroke-width='22'/%3E%3Cpath d='M20 -50 L-30 -20 L-80 -40' stroke='url(%23neon1)' stroke-width='22'/%3E%3Cpath d='M-30 -20 L-20 50 L-70 110' stroke='url(%23neon1)' stroke-width='22'/%3E%3Cpath d='M-20 50 L40 70 L80 120' stroke='url(%23neon1)' stroke-width='20'/%3E%3Cpath d='M-10 -75 L20 -50 L70 -80' stroke='%23ffffff' stroke-width='8' opacity='0.9'/%3E%3Cpath d='M-30 -20 L-20 50 L-70 110' stroke='%23ffffff' stroke-width='8' opacity='0.9'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">

  <title>DANCE TRACE v1.8.0 (iOS Smooth Dual Play)</title>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: rgba(22, 24, 31, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-neon: #00f2fe;
      --accent-dancer: #4facfe;
      --accent-green: #00ff87;
      --accent-yellow: #ffea00;
      --accent-red: #ff0055;
      --text-main: #ffffff;
      --text-sub: #8a8d9b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .header {
      height: 38px; padding: 0 16px;
      padding-top: env(safe-area-inset-top);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(13, 14, 18, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--card-border);
      z-index: 10; flex-shrink: 0;
    }

    .header-title-container { display: flex; align-items: center; gap: 6px; }

    .header-title {
      font-size: 13px; font-weight: 800; letter-spacing: 0.8px;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-dancer));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .version-tag {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      background: rgba(0, 242, 254, 0.15); color: var(--accent-neon);
      border: 0.5px solid rgba(0, 242, 254, 0.3); line-height: 1.2; cursor: pointer;
    }

    .btn-help {
      background: rgba(255, 255, 255, 0.08); border: 0.5px solid var(--card-border);
      color: var(--accent-neon); border-radius: 50%;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-help svg { width: 15px; height: 15px; fill: currentColor; }

    .app-body {
      flex: 1; display: flex; gap: 10px;
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      height: calc(100dvh - 38px);
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      .app-body { flex-direction: column; justify-content: center; gap: 12px; }
      .player-main { height: auto !important; aspect-ratio: 16 / 9; }
      .sidebar-controls {
        width: 100% !important; height: auto !important;
        display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px;
      }
      .file-card { grid-column: span 1; }
      .sync-box { grid-column: span 2; }
      .speed-box { grid-column: span 2; }
      .btn-lock, .btn-reset { grid-column: span 1; }
    }

    .player-main { flex: 1; display: flex; flex-direction: column; gap: 8px; height: 100%; }

    .split-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; }

    .view-box {
      position: relative; width: 100%; height: 100%;
      background: #000000; border-radius: 12px; overflow: hidden;
      border: 0.5px solid var(--card-border); touch-action: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); cursor: grab;
    }
    .view-box:active { cursor: grabbing; }
    .view-box.locked { cursor: default; }

    .view-box canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; pointer-events: none;
    }

    .hidden-video {
      position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none;
    }

    .lock-indicator {
      position: absolute; top: 8px; right: 8px; z-index: 6;
      font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255,255,255,0.2);
      display: none; align-items: center; gap: 4px; color: var(--accent-yellow);
    }
    .locked .lock-indicator { display: flex; }

    .play-overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(18, 20, 26, 0.8); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex; align-items: center; justify-content: center;
      z-index: 20; transition: all 0.25s ease; cursor: pointer; pointer-events: auto;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }

    .play-overlay svg { width: 24px; height: 24px; fill: #ffffff; pointer-events: none; }

    .play-overlay.playing {
      opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.8);
    }

    .grid-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 4;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 60px 60px; background-position: center center;
    }

    .grid-center-line-v {
      position: absolute; left: 50%; top: 0; height: 100%; width: 1px;
      border-left: 1px dashed rgba(0, 242, 254, 0.6); z-index: 5; pointer-events: none;
    }

    .grid-center-line-h {
      position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
      border-top: 1px dashed rgba(0, 242, 254, 0.6); z-index: 5; pointer-events: none;
    }

    .view-badge {
      position: absolute; top: 8px; left: 8px; z-index: 6;
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255, 255, 255, 0.15); letter-spacing: 0.5px;
    }

    .unified-timeline {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 0.5px solid var(--card-border); border-radius: 12px;
      padding: 0 14px; display: flex; align-items: center; gap: 12px; height: 42px;
      position: relative;
    }

    .seekbar-wrapper {
      position: relative; flex: 1; display: flex; align-items: center; height: 100%;
    }

    .time-text {
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--text-main); white-space: nowrap;
    }

    .seekBar {
      width: 100%; height: 4px; -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer;
      position: relative; z-index: 2;
    }

    .seekBar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent-neon); cursor: pointer; box-shadow: 0 0 10px var(--accent-neon);
    }

    .drift-marker-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 3;
    }

    .drift-marker {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--accent-red); background: rgba(255, 0, 85, 0.35);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
      pointer-events: auto; cursor: pointer; transition: transform 0.15s ease;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #fff;
    }
    .drift-marker:active { transform: translate(-50%, -50%) scale(1.3); }

    .sidebar-controls { width: 170px; display: flex; flex-direction: column; gap: 8px; height: 100%; }

    .file-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 0.5px solid var(--card-border); border-radius: 10px;
      padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; position: relative;
    }

    .file-card input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 2;
    }

    .file-header { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }

    .file-name {
      font-size: 10px; color: var(--text-sub); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    .sync-box, .speed-box {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 0.5px solid var(--card-border); border-radius: 10px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }

    .speed-title { font-size: 10px; font-weight: 700; color: var(--text-sub); text-align: center; }

    .speed-btn-group { display: flex; gap: 4px; }
    .speed-btn {
      flex: 1; height: 26px; border-radius: 6px; border: 0.5px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05); color: var(--text-main);
      font-size: 9px; font-weight: 700; cursor: pointer; transition: all 0.15s ease; padding: 0;
    }
    .speed-btn.active {
      background: var(--accent-neon); color: #000; font-weight: 800; border-color: var(--accent-neon);
    }

    .btn {
      height: 34px; padding: 0 8px; border-radius: 8px; border: none;
      font-size: 11px; font-weight: 700; display: inline-flex;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; transition: all 0.15s ease; width: 100%;
    }
    .btn:active { transform: scale(0.96); opacity: 0.8; }

    .btn-sync {
      background: linear-gradient(135deg, var(--accent-dancer), var(--accent-neon));
      color: #000000; box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
    }

    .sync-info {
      font-size: 10px; font-weight: 800; color: var(--accent-green);
      text-align: center; min-height: 14px;
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.08); color: var(--text-main);
      border: 0.5px solid var(--card-border);
    }
    .btn-lock.active {
      background: rgba(255, 234, 0, 0.15); color: var(--accent-yellow);
      border: 0.5px solid rgba(255, 234, 0, 0.4);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05); color: var(--text-sub);
      border: 0.5px solid var(--card-border); margin-top: auto;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      width: 380px; max-width: 90vw; max-height: 85dvh;
      background: rgba(22, 24, 31, 0.95); border: 0.5px solid var(--card-border);
      border-radius: 18px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    }

    .modal-title { font-size: 15px; font-weight: 800; text-align: center; color: var(--accent-neon); }
    .step-list { display: flex; flex-direction: column; gap: 12px; }
    .step-item { display: flex; align-items: flex-start; gap: 10px; font-size: 11px; line-height: 1.5; color: #e5e5ea; }
    .step-num {
      background: var(--accent-dancer); color: #000; font-weight: 800; font-size: 10px;
      width: 18px; height: 18px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
    }

    .modal-close-btn {
      background: linear-gradient(135deg, var(--accent-dancer), var(--accent-neon));
      color: #000; border: none; border-radius: 10px; height: 38px;
      font-size: 12px; font-weight: 800; cursor: pointer; width: 100%; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title-container">
      <div class="header-title">DANCE TRACE</div>
      <span class="version-tag" id="versionTag">v1.8.0</span>
    </div>
    <button class="btn-help" id="helpBtn">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
    </button>
  </div>

  <div class="app-body">
    <div class="player-main">
      <div class="split-container" id="videoArea">
        <div class="view-box" id="box1">
          <div class="view-badge" style="color: var(--accent-neon);">REF (お手本)</div>
          <div class="lock-indicator">固定中</div>
          <div class="grid-overlay"></div>
          <div class="grid-center-line-v"></div>
          <div class="grid-center-line-h"></div>
          <canvas id="canvas1"></canvas>
        </div>

        <div class="view-box" id="box2">
          <div class="view-badge" style="color: var(--accent-green);">USER (自分)</div>
          <div class="lock-indicator">固定中</div>
          <div class="grid-overlay"></div>
          <div class="grid-center-line-v"></div>
          <div class="grid-center-line-h"></div>
          <canvas id="canvas2"></canvas>
        </div>

        <video id="video1" class="hidden-video" playsinline webkit-playsinline preload="auto"></video>
        <video id="video2" class="hidden-video" playsinline webkit-playsinline muted preload="auto"></video>

        <div class="play-overlay" id="playOverlay">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div class="unified-timeline">
        <span class="time-text" id="currentTimeText">00:00</span>
        <div class="seekbar-wrapper">
          <input type="range" class="seekBar" id="seekBar" value="0" min="0" max="100" step="0.1">
          <div class="drift-marker-container" id="driftMarkerContainer"></div>
        </div>
        <span class="time-text" id="durationText" style="color: var(--text-sub);">00:00</span>
      </div>
    </div>

    <div class="sidebar-controls">
      <div class="file-card">
        <div class="file-header" style="color: var(--accent-neon);">📁 動画1 (REF)</div>
        <div class="file-name" id="fileName1">選択してください</div>
        <input type="file" id="videoInput1" accept="video/*">
      </div>

      <div class="file-card">
        <div class="file-header" style="color: var(--accent-green);">📁 動画2 (USER)</div>
        <div class="file-name" id="fileName2">選択してください</div>
        <input type="file" id="videoInput2" accept="video/*">
      </div>

      <div class="speed-box">
        <div class="speed-title">再生速度</div>
        <div class="speed-btn-group">
          <button class="speed-btn" data-speed="0.5">0.5x</button>
          <button class="speed-btn" data-speed="0.75">0.75x</button>
          <button class="speed-btn active" data-speed="1.0">1.0x</button>
          <button class="speed-btn" data-speed="1.25">1.25x</button>
        </div>
      </div>

      <div class="sync-box">
        <button class="btn btn-sync" id="syncAudioBtn">⚡ 音声自動同期</button>
        <div class="sync-info" id="syncStatus">差: 0.00s</div>
      </div>

      <button class="btn btn-lock" id="lockBtn">
        <span id="lockText">位置調整可</span>
      </button>

      <button class="btn btn-reset" id="resetBtn">位置リセット</button>
    </div>
  </div>

  <div class="modal-overlay" id="guideModal">
    <div class="modal-card">
      <div class="modal-title">DANCE TRACE の使い方</div>
      <div class="step-list">
        <div class="step-item">
          <div class="step-num">1</div>
          <div><b>動画の読み込み</b><br>左右の枠から動画を選択します。</div>
        </div>
        <div class="step-item">
          <div class="step-num">2</div>
          <div><b>⚡ 音声自動同期</b><br>ビート音を解析して同期します。ズレが大きいポイントには赤丸を表示します。</div>
        </div>
        <div class="step-item">
          <div class="step-num">3</div>
          <div><b>動画内のズレ丸表示</b><br>シークバーの赤丸をタップすると2秒前から再生。ズレタイミングに達すると動画内にターゲット丸印が表示されます。</div>
        </div>
      </div>
      <button class="modal-close-btn" id="closeGuideModalBtn">閉じる</button>
    </div>
  </div>

  <script>
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const canvas1 = document.getElementById('canvas1');
    const canvas2 = document.getElementById('canvas2');
    const ctx1 = canvas1.getContext('2d', { alpha: false, desynchronized: true });
    const ctx2 = canvas2.getContext('2d', { alpha: false, desynchronized: true });

    const videoInput1 = document.getElementById('videoInput1');
    const videoInput2 = document.getElementById('videoInput2');
    const fileName1 = document.getElementById('fileName1');
    const fileName2 = document.getElementById('fileName2');
    const syncAudioBtn = document.getElementById('syncAudioBtn');
    const lockBtn = document.getElementById('lockBtn');
    const lockText = document.getElementById('lockText');
    const resetBtn = document.getElementById('resetBtn');
    const syncStatus = document.getElementById('syncStatus');
    const playOverlay = document.getElementById('playOverlay');
    const playIcon = document.getElementById('playIcon');
    const seekBar = document.getElementById('seekBar');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');
    const driftMarkerContainer = document.getElementById('driftMarkerContainer');
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');
    const guideModal = document.getElementById('guideModal');
    const helpBtn = document.getElementById('helpBtn');
    const closeGuideModalBtn = document.getElementById('closeGuideModalBtn');

    let url1 = null, url2 = null;
    let fileObj1 = null, fileObj2 = null;
    let audioOffset = 0.0;
    let currentSpeed = 1.0;
    let isLocked = false;
    let isUserSeeking = false;
    let animFrameId = null;
    let detectedDriftPoints = []; // 検出されたズレ地点配列
    let lastSyncCorrectionTime = 0; // iOSでのカクつき防止用タイマー

    video1.muted = false;
    video2.muted = true;
    video2.volume = 0;

    const transform1 = { x: 0, y: 0, scale: 1 };
    const transform2 = { x: 0, y: 0, scale: 1 };

    let box1Size = { width: 0, height: 0, dpr: 1 };
    let box2Size = { width: 0, height: 0, dpr: 1 };

    function updateCanvasSizes() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect1 = box1.getBoundingClientRect();
      const rect2 = box2.getBoundingClientRect();
      
      if (rect1.width > 0 && rect1.height > 0) {
        box1Size = { width: rect1.width, height: rect1.height, dpr };
        canvas1.width = Math.floor(rect1.width * dpr);
        canvas1.height = Math.floor(rect1.height * dpr);
      }
      if (rect2.width > 0 && rect2.height > 0) {
        box2Size = { width: rect2.width, height: rect2.height, dpr };
        canvas2.width = Math.floor(rect2.width * dpr);
        canvas2.height = Math.floor(rect2.height * dpr);
      }
      renderOnce();
    }

    window.addEventListener('resize', updateCanvasSizes);
    window.addEventListener('orientationchange', () => setTimeout(updateCanvasSizes, 200));

    helpBtn.addEventListener('click', () => guideModal.classList.add('show'));
    closeGuideModalBtn.addEventListener('click', () => guideModal.classList.remove('show'));

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSpeed = parseFloat(e.target.getAttribute('data-speed'));
        video1.playbackRate = currentSpeed;
        video2.playbackRate = currentSpeed;
      });
    });

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateSyncUI() {
      const sign = audioOffset >= 0 ? '+' : '';
      syncStatus.textContent = `差: ${sign}${audioOffset.toFixed(3)}s`;
    }

    function updatePlayButtonUI(isPlaying) {
      if (isPlaying) {
        playOverlay.classList.add('playing');
      } else {
        playOverlay.classList.remove('playing');
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    // 動画フレームの描画および画面上の赤丸（ターゲット）描画
    function drawFrame(ctx, video, sizeInfo, transform, isUserVideo = false) {
      if (!video.videoWidth || !video.videoHeight || sizeInfo.width === 0 || sizeInfo.height === 0) return;

      const dpr = sizeInfo.dpr;
      ctx.save();
      ctx.scale(dpr, dpr);

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scaleToFit = Math.min(sizeInfo.width / vw, sizeInfo.height / vh);
      const dw = vw * scaleToFit;
      const dh = vh * scaleToFit;

      ctx.clearRect(0, 0, sizeInfo.width, sizeInfo.height);
      ctx.translate(sizeInfo.width / 2 + transform.x, sizeInfo.height / 2 + transform.y);
      ctx.scale(transform.scale, transform.scale);
      ctx.drawImage(video, -dw / 2, -dh / 2, dw, dh);

      // 動画内（USER側）のズレ位置に画面上のターゲット赤丸を描画
      if (isUserVideo && detectedDriftPoints.length > 0) {
        const curTime = video1.currentTime;
        // 現在の再生時刻がズレ検出ポイントの前後0.8秒以内にあるか判定
        const activeDrift = detectedDriftPoints.find(p => Math.abs(curTime - p.timeSec) < 0.8);

        if (activeDrift) {
          const radius = Math.min(dw, dh) * 0.22; // 画面サイズに合わせた動的サイズ
          
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#ff0055';
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 20;
          ctx.stroke();

          // 内側に番号テキストを表示
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowBlur = 0;
          ctx.fillText(`! ズレ ${activeDrift.index}`, 0, 0);
        }
      }

      ctx.restore();
    }

    function renderOnce() {
      if (video1.src) drawFrame(ctx1, video1, box1Size, transform1, false);
      if (video2.src) drawFrame(ctx2, video2, box2Size, transform2, true);
      updateTimeline();
    }

    // iOSでのカクつきを防ぐマイルドな同期制御（1秒に1回以上の極端なseek処理を行わない）
    function syncVideoDrift() {
      if (!video1.src || !video2.src || video1.paused || video2.paused) return;

      const now = Date.now();
      const expectedTime2 = video1.currentTime - audioOffset;
      const diff = video2.currentTime - expectedTime2;

      // 0.15秒以上のズレがあり、かつ前回の修正から1.2秒以上経っている場合のみ同期
      if (Math.abs(diff) > 0.15 && (now - lastSyncCorrectionTime > 1200)) {
        if (expectedTime2 >= 0 && expectedTime2 <= video2.duration) {
          video2.currentTime = expectedTime2;
          lastSyncCorrectionTime = now;
        }
      }
    }

    function renderLoop() {
      const isPlaying = (!video1.paused && video1.src) || (!video2.paused && video2.src);

      if (isPlaying) {
        syncVideoDrift();

        if (video1.src) drawFrame(ctx1, video1, box1Size, transform1, false);
        if (video2.src) drawFrame(ctx2, video2, box2Size, transform2, true);

        updateTimeline();

        if ('requestVideoFrameCallback' in video1) {
          video1.requestVideoFrameCallback(renderLoop);
        } else {
          animFrameId = requestAnimationFrame(renderLoop);
        }
      }
    }

    async function togglePlay() {
      if (!video1.src && !video2.src) { alert("動画を選択してください"); return; }

      const mainVideo = video1.src ? video1 : video2;
      const isPaused = mainVideo.paused;

      if (isPaused) {
        try {
          video1.muted = false;
          video2.muted = true;
          video1.playbackRate = currentSpeed;
          video2.playbackRate = currentSpeed;

          if (video1.src && video2.src) {
            const targetTime2 = video1.currentTime - audioOffset;
            if (targetTime2 >= 0 && targetTime2 <= video2.duration) {
              video2.currentTime = targetTime2;
            }
          }

          const playPromises = [];
          if (video1.src) playPromises.push(video1.play());
          if (video2.src) playPromises.push(video2.play());

          await Promise.all(playPromises);

          updatePlayButtonUI(true);
          if (animFrameId) cancelAnimationFrame(animFrameId);
          renderLoop();
        } catch (err) {
          console.error("再生エラー:", err);
        }
      } else {
        if (video1.src) video1.pause();
        if (video2.src) video2.pause();
        updatePlayButtonUI(false);
        if (animFrameId) cancelAnimationFrame(animFrameId);
        renderOnce();
      }
    }

    playOverlay.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    function updateTimeline() {
      const mainVideo = video1.src ? video1 : video2;
      if (mainVideo && mainVideo.duration && !isUserSeeking) {
        seekBar.value = (mainVideo.currentTime / mainVideo.duration) * 100;
        currentTimeText.textContent = formatTime(mainVideo.currentTime);
      }
    }

    function seekToTime(targetTime) {
      const mainVideo = video1.src ? video1 : video2;
      if (!mainVideo || !mainVideo.duration) return;

      const clampedTime = Math.max(0, Math.min(targetTime, mainVideo.duration));
      if (video1.src) video1.currentTime = clampedTime;
      if (video2.src) {
        const t2 = clampedTime - audioOffset;
        if (t2 >= 0 && t2 <= video2.duration) video2.currentTime = t2;
      }
      currentTimeText.textContent = formatTime(clampedTime);
      seekBar.value = (clampedTime / mainVideo.duration) * 100;
      renderOnce();
    }

    seekBar.addEventListener('input', () => {
      isUserSeeking = true;
      const mainVideo = video1.src ? video1 : video2;
      if (mainVideo && mainVideo.duration) {
        seekToTime((seekBar.value / 100) * mainVideo.duration);
      }
    });

    seekBar.addEventListener('change', () => { isUserSeeking = false; });

    function setupTouchControl(boxEl, transformObj) {
      let activePointers = new Map();
      let initialDistance = 0;
      let startScale = 1;
      let startX = 0, startY = 0;
      let isMoved = false;
      let lastTapTime = 0;

      function getDistance(p1, p2) {
        return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
      }

      boxEl.addEventListener('wheel', (e) => {
        if (isLocked) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        transformObj.scale = Math.min(Math.max(transformObj.scale + delta, 0.2), 5.0);
        renderOnce();
      }, { passive: false });

      boxEl.addEventListener('pointerdown', (e) => {
        if (isLocked) return;
        boxEl.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

        if (activePointers.size === 1) {
          isMoved = false;
          startX = e.clientX - transformObj.x;
          startY = e.clientY - transformObj.y;
        } else if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          initialDistance = getDistance(pts[0], pts[1]);
          startScale = transformObj.scale;
        }
      });

      boxEl.addEventListener('pointermove', (e) => {
        if (isLocked || !activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

        if (activePointers.size === 1) {
          const currentX = e.clientX - startX;
          const currentY = e.clientY - startY;
          if (Math.abs(currentX - transformObj.x) > 3 || Math.abs(currentY - transformObj.y) > 3) {
            isMoved = true;
          }
          transformObj.x = currentX;
          transformObj.y = currentY;
          renderOnce();
        } else if (activePointers.size === 2) {
          isMoved = true;
          const pts = Array.from(activePointers.values());
          const dist = getDistance(pts[0], pts[1]);
          if (initialDistance > 0) {
            const factor = dist / initialDistance;
            transformObj.scale = Math.min(Math.max(startScale * factor, 0.2), 5.0);
            renderOnce();
          }
        }
      });

      const handlePointerUp = (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.delete(e.pointerId);
          try { boxEl.releasePointerCapture(e.pointerId); } catch(err){}
        }

        if (activePointers.size < 2) initialDistance = 0;

        if (!isMoved && activePointers.size === 0) {
          const now = Date.now();
          if (now - lastTapTime < 300) {
            transformObj.x = 0; transformObj.y = 0; transformObj.scale = 1;
            renderOnce();
          } else {
            togglePlay();
          }
          lastTapTime = now;
        }
      };

      boxEl.addEventListener('pointerup', handlePointerUp);
      boxEl.addEventListener('pointercancel', handlePointerUp);
    }

    setupTouchControl(box1, transform1);
    setupTouchControl(box2, transform2);

    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      transform1.x = 0; transform1.y = 0; transform1.scale = 1;
      transform2.x = 0; transform2.y = 0; transform2.scale = 1;
      renderOnce();
    });

    lockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isLocked = !isLocked;
      if (isLocked) {
        lockText.textContent = "位置固定中";
        lockBtn.classList.add('active');
        box1.classList.add('locked');
        box2.classList.add('locked');
      } else {
        lockText.textContent = "位置調整可";
        lockBtn.classList.remove('active');
        box1.classList.remove('locked');
        box2.classList.remove('locked');
      }
    });

    function setupVideo(videoEl, fileObj, isFirst) {
      if (!fileObj) return null;

      if (isFirst && url1) URL.revokeObjectURL(url1);
      if (!isFirst && url2) URL.revokeObjectURL(url2);

      const objectUrl = URL.createObjectURL(fileObj);
      videoEl.src = objectUrl;
      videoEl.load();

      videoEl.onloadedmetadata = () => {
        updateCanvasSizes();
        const mainVideo = video1.duration ? video1 : video2;
        if (mainVideo.duration) {
          durationText.textContent = formatTime(mainVideo.duration);
        }
        renderOnce();
      };

      return objectUrl;
    }

    videoInput1.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        fileObj1 = e.target.files[0];
        fileName1.textContent = fileObj1.name;
        url1 = setupVideo(video1, fileObj1, true);
        updatePlayButtonUI(false);
        driftMarkerContainer.innerHTML = '';
        detectedDriftPoints = [];
      }
    });

    videoInput2.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        fileObj2 = e.target.files[0];
        fileName2.textContent = fileObj2.name;
        url2 = setupVideo(video2, fileObj2, false);
        updatePlayButtonUI(false);
        driftMarkerContainer.innerHTML = '';
        detectedDriftPoints = [];
      }
    });

    async function extractAudioData(fileObj) {
      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtxClass();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const arrayBuffer = await fileObj.arrayBuffer();

      return new Promise((resolve, reject) => {
        audioCtx.decodeAudioData(
          arrayBuffer,
          (buffer) => {
            const rawData = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            audioCtx.close();
            resolve({ rawData, sampleRate });
          },
          (err) => {
            audioCtx.close();
            reject(err);
          }
        );
      });
    }

    function computeOnsetEnvelope(rawData, sampleRate, targetFps) {
      const windowSize = Math.floor(sampleRate / targetFps);
      const numFrames = Math.floor(rawData.length / windowSize);
      const envelope = new Float32Array(numFrames);

      for (let i = 0; i < numFrames; i++) {
        let sum = 0;
        const start = i * windowSize;
        for (let j = 0; j < windowSize; j++) {
          const val = rawData[start + j] || 0;
          sum += val * val;
        }
        envelope[i] = Math.sqrt(sum / windowSize);
      }

      const onset = new Float32Array(numFrames);
      for (let i = 1; i < numFrames; i++) {
        const diff = envelope[i] - envelope[i - 1];
        onset[i] = diff > 0 ? diff : 0;
      }

      return onset;
    }

    function detectTopDrifts(onset1, onset2, bestFineShift, fps) {
      const numFrames = Math.min(onset1.length, onset2.length);
      const diffs = [];

      for (let i = 0; i < numFrames; i++) {
        const j = i + bestFineShift;
        if (j >= 0 && j < onset1.length) {
          const diff = Math.abs(onset1[j] - onset2[i]);
          diffs.push({ timeSec: j / fps, diff });
        }
      }

      const minIntervalSec = 3.0;
      diffs.sort((a, b) => b.diff - a.diff);

      const topPoints = [];
      for (const item of diffs) {
        if (topPoints.length >= 5) break;
        const isFarEnough = topPoints.every(p => Math.abs(p.timeSec - item.timeSec) >= minIntervalSec);
        if (isFarEnough && item.timeSec > 2.0) {
          topPoints.push(item);
        }
      }

      topPoints.sort((a, b) => a.timeSec - b.timeSec);
      return topPoints.map((pt, idx) => ({ ...pt, index: idx + 1 }));
    }

    function renderDriftMarkers(topPoints) {
      driftMarkerContainer.innerHTML = '';
      const mainVideo = video1.duration ? video1 : video2;
      if (!mainVideo || !mainVideo.duration) return;

      const duration = mainVideo.duration;

      topPoints.forEach((pt) => {
        const percent = (pt.timeSec / duration) * 100;
        if (percent < 0 || percent > 100) return;

        const marker = document.createElement('div');
        marker.className = 'drift-marker';
        marker.style.left = `${percent}%`;
        marker.textContent = pt.index;

        marker.addEventListener('click', async (e) => {
          e.stopPropagation();
          const targetTime = Math.max(0, pt.timeSec - 2.0);
          seekToTime(targetTime);

          if (video1.paused && video2.paused) {
            await togglePlay();
          }
        });

        driftMarkerContainer.appendChild(marker);
      });
    }

    async function syncAudio() {
      if (!fileObj1 || !fileObj2) { alert("両方の動画を選択してください"); return; }
      syncStatus.textContent = "解析中...";
      syncStatus.style.color = "var(--accent-neon)";

      setTimeout(async () => {
        try {
          const [res1, res2] = await Promise.all([
            extractAudioData(fileObj1),
            extractAudioData(fileObj2)
          ]);

          const coarseFps = 100;
          const onset1_coarse = computeOnsetEnvelope(res1.rawData, res1.sampleRate, coarseFps);
          const onset2_coarse = computeOnsetEnvelope(res2.rawData, res2.sampleRate, coarseFps);

          const maxSec = 15;
          const len1 = Math.min(onset1_coarse.length, coarseFps * maxSec);
          const len2 = Math.min(onset2_coarse.length, coarseFps * maxSec);

          const maxCoarseShift = Math.floor(coarseFps * 12);
          let bestCoarseShift = 0;
          let maxCoarseCorr = -Infinity;

          for (let shift = -maxCoarseShift; shift <= maxCoarseShift; shift++) {
            let sum = 0;
            let count = 0;
            for (let i = 0; i < len2; i++) {
              const j = i + shift;
              if (j >= 0 && j < len1) {
                sum += onset2_coarse[i] * onset1_coarse[j];
                count++;
              }
            }
            if (count > 0) sum /= count;
            if (sum > maxCoarseCorr) {
              maxCoarseCorr = sum;
              bestCoarseShift = shift;
            }
          }

          const approxOffsetSec = bestCoarseShift / coarseFps;

          const fineFps = 1000;
          const onset1_fine = computeOnsetEnvelope(res1.rawData, res1.sampleRate, fineFps);
          const onset2_fine = computeOnsetEnvelope(res2.rawData, res2.sampleRate, fineFps);

          const fineCenterShift = Math.floor(approxOffsetSec * fineFps);
          const fineSearchWindow = Math.floor(fineFps * 0.5);

          let bestFineShift = fineCenterShift;
          let maxFineCorr = -Infinity;

          const fineLen2 = Math.min(onset2_fine.length, fineFps * maxSec);
          const fineLen1 = onset1_fine.length;

          for (let shift = fineCenterShift - fineSearchWindow; shift <= fineCenterShift + fineSearchWindow; shift++) {
            let sum = 0;
            let count = 0;
            for (let i = 0; i < fineLen2; i++) {
              const j = i + shift;
              if (j >= 0 && j < fineLen1) {
                sum += onset2_fine[i] * onset1_fine[j];
                count++;
              }
            }
            if (count > 0) sum /= count;
            if (sum > maxFineCorr) {
              maxFineCorr = sum;
              bestFineShift = shift;
            }
          }

          audioOffset = bestFineShift / fineFps;
          updateSyncUI();
          syncStatus.style.color = "var(--accent-green)";

          detectedDriftPoints = detectTopDrifts(onset1_coarse, onset2_coarse, bestCoarseShift, coarseFps);
          renderDriftMarkers(detectedDriftPoints);

          if (video1.src && video2.src) {
            const targetTime2 = video1.currentTime - audioOffset;
            if (targetTime2 >= 0 && targetTime2 <= video2.duration) {
              video2.currentTime = targetTime2;
            }
          }
          renderOnce();
        } catch (err) {
          console.error("Audio Sync Error:", err);
          syncStatus.textContent = "解析エラー";
          syncStatus.style.color = "var(--accent-red)";
        }
      }, 50);
    }

    syncAudioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      syncAudio();
    });

    updateCanvasSizes();
  </script>
</body>
