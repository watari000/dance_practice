<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS Safari用 フルスクリーン（PWA）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pose Align">

  <title>Pose Align Viewer - Unified Player</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-blue: #0A84FF;
      --accent-green: #30D158;
      --accent-red: #FF453A;
      --accent-yellow: #FFD60A;
      --text-main: #FFFFFF;
      --text-sub: #8E8E93;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 縦画面用アラートカバー */
    .portrait-warning {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }
    
    .portrait-warning svg {
      width: 64px; height: 64px;
      fill: var(--accent-blue);
      animation: rotateHint 2s infinite ease-in-out;
    }

    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    /* 縦画面時に表示 */
    @media screen and (orientation: portrait) {
      .portrait-warning { display: flex; }
    }

    /* ヘッダー */
    .header {
      height: 40px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 22, 24, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--card-border);
      z-index: 10;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-help {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--accent-blue);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-help svg { width: 16px; height: 16px; fill: currentColor; }

    /* メインボディ */
    .app-body {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 10px;
      height: calc(100vh - 40px);
    }

    .player-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .split-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      position: relative;
    }

    .view-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 0.5px solid var(--card-border);
      touch-action: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }
    .view-box:active { cursor: grabbing; }
    .view-box.locked { cursor: default; }

    .view-box video { display: none; }

    .view-box canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .lock-indicator {
      position: absolute;
      top: 10px; right: 10px;
      z-index: 6;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255,255,255,0.2);
      display: none;
      align-items: center;
      gap: 4px;
    }
    .locked .lock-indicator { display: flex; }

    /* 中央再生ボタン */
    .play-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(30, 30, 32, 0.75);
      backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .play-overlay svg {
      width: 26px; height: 26px;
      fill: #fff;
    }

    .play-overlay.playing {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
    }

    /* グリッド */
    .grid-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 80px 80px;
      background-position: center center;
    }

    .grid-center-line-h {
      position: absolute;
      top: 50%; left: 0; width: 100%; height: 1px;
      border-top: 1px dashed rgba(255, 255, 255, 0.5);
      z-index: 5; pointer-events: none;
    }
    .grid-center-line-v {
      position: absolute;
      left: 50%; top: 0; height: 100%; width: 1px;
      border-left: 1px dashed rgba(255, 255, 255, 0.5);
      z-index: 5; pointer-events: none;
    }

    .view-badge {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 6;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.5px;
    }

    /* 統合タイムライン */
    .unified-timeline {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--card-border);
      border-radius: 12px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
    }

    .time-text {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      white-space: nowrap;
    }

    .seekBar {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      outline: none;
    }

    .seekBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* 右側サイドバー */
    .sidebar-controls {
      width: 165px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .file-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .file-card input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
      z-index: 2;
    }

    .file-header {
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .file-name {
      font-size: 10px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      height: 40px;
      padding: 0 10px;
      border-radius: 12px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn:active {
      transform: scale(0.97);
      opacity: 0.8;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .btn-sync {
      background: var(--accent-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border: 0.5px solid var(--card-border);
    }
    .btn-lock.active {
      background: rgba(255, 214, 10, 0.2);
      color: var(--accent-yellow);
      border: 0.5px solid rgba(255, 214, 10, 0.4);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 0.5px solid var(--card-border);
      margin-top: auto;
    }

    .sync-info {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: center;
      min-height: 14px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 320px;
      background: rgba(30, 30, 35, 0.95);
      border: 0.5px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #E5E5EA;
    }

    .step-num {
      background: var(--accent-blue);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .modal-close-btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      height: 38px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 縦向き時に表示するカバー指示 -->
  <div class="portrait-warning">
    <svg viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5c-.47-4.82-3.48-8.88-7.66-10.74l.19 2.26zm1.02 18.96c-3.27-1.55-5.61-4.72-5.97-8.48h-1.5c.47 4.82 3.48 8.88 7.66 10.74l-.19-2.26zM17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
    <div style="font-weight: 700; font-size: 16px;">画面を横向きにしてください</div>
    <div style="font-size: 12px; color: var(--text-sub);">iPhoneの「画面縦ロック」を解除して<br>端末を横にしてご使用ください</div>
  </div>

  <div class="header">
    <div class="header-title">
      <span style="color: var(--accent-blue);">●</span> POSE ALIGN
    </div>
    <button class="btn-help" id="helpBtn" title="使い方">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
    </button>
  </div>

  <div class="app-body">
    <div class="player-main">
      <div class="split-container" id="videoArea">
        <div class="view-box" id="box1">
          <div class="view-badge" style="color: var(--accent-blue);">REF</div>
          <div class="lock-indicator">
            <svg style="width:12px;height:12px;fill:var(--accent-yellow)" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            固定中
          </div>
          <div class="grid-overlay"></div>
          <div class="grid-center-line-h"></div>
          <div class="grid-center-line-v"></div>
          
          <video id="video1" playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
          <canvas id="canvas1"></canvas>
        </div>

        <div class="view-box" id="box2">
          <div class="view-badge" style="color: var(--accent-green);">USER</div>
          <div class="lock-indicator">
            <svg style="width:12px;height:12px;fill:var(--accent-yellow)" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            固定中
          </div>
          <div class="grid-overlay"></div>
          <div class="grid-center-line-h"></div>
          <div class="grid-center-line-v"></div>
          <video id="video2" playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
          <canvas id="canvas2"></canvas>
        </div>

        <div class="play-overlay" id="playOverlay">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div class="unified-timeline">
        <span class="time-text" id="currentTimeText">00:00</span>
        <input type="range" class="seekBar" id="seekBar" value="0" min="0" max="100" step="0.1">
        <span class="time-text" id="durationText" style="color: var(--text-sub);">00:00</span>
      </div>
    </div>

    <div class="sidebar-controls">
      <div class="file-card">
        <div class="file-header" style="color: var(--accent-blue);">
          <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
          動画1 (REF)
        </div>
        <div class="file-name" id="fileName1">タップして選択</div>
        <input type="file" id="videoInput1" accept="video/*" playsinline>
      </div>

      <div class="file-card">
        <div class="file-header" style="color: var(--accent-green);">
          <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
          動画2 (USER)
        </div>
        <div class="file-name" id="fileName2">タップして選択</div>
        <input type="file" id="videoInput2" accept="video/*" playsinline>
      </div>

      <button class="btn btn-sync" id="syncAudioBtn">
        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        音声自動同期
      </button>
      <div class="sync-info" id="syncStatus"></div>

      <button class="btn btn-lock" id="lockBtn">
        <svg id="lockIcon" viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>
        <span id="lockText">位置調整可</span>
      </button>

      <button class="btn btn-reset" id="resetBtn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        位置リセット
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="guideModal">
    <div class="modal-card">
      <div class="modal-title">
        <span style="color: var(--accent-blue)">●</span> 使い方ナビゲーション
      </div>
      <div class="step-list">
        <div class="step-item">
          <div class="step-num">1</div>
          <div>右側の「📁動画1」「📁動画2」をタップして比較したい2つの動画を選択します。</div>
        </div>
        <div class="step-item">
          <div class="step-num">2</div>
          <div><b>「⚡音声自動同期」</b>を押すと、音声を解析して2つの動画のズレを瞬時に自動調整します。</div>
        </div>
        <div class="step-item">
          <div class="step-num">3</div>
          <div>画面タップで再生/一時停止。画面下部のタイムラインで<b>1つの動画のように操作</b>できます。指で動画を滑らせて位置合わせも可能です。</div>
        </div>
      </div>
      <button class="modal-close-btn" id="closeModalBtn">はじめる</button>
    </div>
  </div>

  <script>
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const canvas1 = document.getElementById('canvas1');
    const canvas2 = document.getElementById('canvas2');
    const ctx1 = canvas1.getContext('2d');
    const ctx2 = canvas2.getContext('2d');

    const videoInput1 = document.getElementById('videoInput1');
    const videoInput2 = document.getElementById('videoInput2');
    const fileName1 = document.getElementById('fileName1');
    const fileName2 = document.getElementById('fileName2');
    const syncAudioBtn = document.getElementById('syncAudioBtn');
    const lockBtn = document.getElementById('lockBtn');
    const lockIcon = document.getElementById('lockIcon');
    const lockText = document.getElementById('lockText');
    const resetBtn = document.getElementById('resetBtn');
    const syncStatus = document.getElementById('syncStatus');
    const playOverlay = document.getElementById('playOverlay');
    const playIcon = document.getElementById('playIcon');
    const seekBar = document.getElementById('seekBar');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');

    const guideModal = document.getElementById('guideModal');
    const helpBtn = document.getElementById('helpBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let url1 = null, url2 = null;
    let fileObj1 = null, fileObj2 = null;
    let audioOffset = 0;
    let isLocked = false;
    let isUserSeeking = false;

    const transform1 = { x: 0, y: 0, scale: 1 };
    const transform2 = { x: 0, y: 0, scale: 1 };

    helpBtn.addEventListener('click', () => guideModal.classList.add('show'));
    closeModalBtn.addEventListener('click', () => guideModal.classList.remove('show'));

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updatePlayButtonUI(isPlaying) {
      if (isPlaying) {
        playOverlay.classList.add('playing');
      } else {
        playOverlay.classList.remove('playing');
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    function togglePlay() {
      if (!url1 || !url2) { alert("両方の動画を選択してください"); return; }

      if (video2.paused || video1.paused) {
        video1.muted = false; video2.muted = false;
        video1.volume = 1.0; video2.volume = 1.0;

        if (video1.ended) video1.currentTime = 0;
        if (video2.ended) video2.currentTime = 0;

        alignVideoTime();
        video1.play(); video2.play();
        updatePlayButtonUI(true);
      } else {
        video1.pause(); video2.pause();
        updatePlayButtonUI(false);
      }
    }

    document.getElementById('videoArea').addEventListener('click', togglePlay);

    function renderFrame() {
      const w1 = canvas1.width || 300, h1 = canvas1.height || 400;
      ctx1.clearRect(0, 0, w1, h1);
      if (video1.readyState >= 2) {
        ctx1.save();
        ctx1.translate(w1 / 2 + transform1.x, h1 / 2 + transform1.y);
        ctx1.scale(transform1.scale, transform1.scale);
        ctx1.drawImage(video1, -w1 / 2, -h1 / 2, w1, h1);
        ctx1.restore();
      }

      const w2 = canvas2.width || 300, h2 = canvas2.height || 400;
      ctx2.clearRect(0, 0, w2, h2);
      if (video2.readyState >= 2) {
        ctx2.save();
        ctx2.translate(w2 / 2 + transform2.x, h2 / 2 + transform2.y);
        ctx2.scale(transform2.scale, transform2.scale);
        ctx2.drawImage(video2, -w2 / 2, -h2 / 2, w2, h2);
        ctx2.restore();
      }
    }

    function loop() {
      if (!video2.paused && !video2.ended) {
        let expectedTime = video2.currentTime + audioOffset;
        if (Math.abs(video1.currentTime - expectedTime) > 0.08 && expectedTime >= 0 && expectedTime <= video1.duration) {
          video1.currentTime = expectedTime;
        }

        if (!isUserSeeking && video2.duration) {
          seekBar.value = (video2.currentTime / video2.duration) * 100;
          currentTimeText.textContent = formatTime(video2.currentTime);
        }
      }
      renderFrame();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    seekBar.addEventListener('input', () => {
      isUserSeeking = true;
      if (video2.duration) {
        const targetTime = (seekBar.value / 100) * video2.duration;
        video2.currentTime = targetTime;
        video1.currentTime = targetTime + audioOffset;
        currentTimeText.textContent = formatTime(targetTime);
      }
    });

    seekBar.addEventListener('change', () => {
      isUserSeeking = false;
    });

    [video1, video2].forEach(v => {
      v.addEventListener('ended', () => {
        video1.pause(); video2.pause();
        updatePlayButtonUI(false);
      });
      v.addEventListener('pause', () => {
        if (video1.paused && video2.paused) updatePlayButtonUI(false);
      });
      v.addEventListener('play', () => {
        updatePlayButtonUI(true);
      });
    });

    function setupTouchControl(boxEl, transformObj) {
      let isDragging = false;
      let startX = 0, startY = 0;

      boxEl.addEventListener('pointerdown', (e) => {
        if (isLocked) return;
        isDragging = true;
        startX = e.clientX - transformObj.x;
        startY = e.clientY - transformObj.y;
        boxEl.setPointerCapture(e.pointerId);
      });

      boxEl.addEventListener('pointermove', (e) => {
        if (!isDragging || isLocked) return;
        transformObj.x = e.clientX - startX;
        transformObj.y = e.clientY - startY;
        renderFrame();
      });

      const stopDrag = (e) => {
        isDragging = false;
        try { boxEl.releasePointerCapture(e.pointerId); } catch(err){}
      };
      boxEl.addEventListener('pointerup', stopDrag);
      boxEl.addEventListener('pointercancel', stopDrag);
    }

    setupTouchControl(box1, transform1);
    setupTouchControl(box2, transform2);

    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      transform1.x = 0; transform1.y = 0;
      transform2.x = 0; transform2.y = 0;
      renderFrame();
    });

    lockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isLocked = !isLocked;
      if (isLocked) {
        lockText.textContent = "位置固定中";
        lockIcon.innerHTML = `<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>`;
        lockBtn.classList.add('active');
        box1.classList.add('locked');
        box2.classList.add('locked');
      } else {
        lockText.textContent = "位置調整可";
        lockIcon.innerHTML = `<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>`;
        lockBtn.classList.remove('active');
        box1.classList.remove('locked');
        box2.classList.remove('locked');
      }
    });

    function setupVideo(videoEl, fileObj, canvasEl, isFirst) {
      if (!fileObj) return null;
      if (isFirst && url1) URL.revokeObjectURL(url1);
      if (!isFirst && url2) URL.revokeObjectURL(url2);

      const objectUrl = URL.createObjectURL(fileObj);
      videoEl.src = objectUrl;

      videoEl.onloadeddata = () => {
        const MAX_DIM = 720;
        let w = videoEl.videoWidth || 360;
        let h = videoEl.videoHeight || 640;
        if (w > MAX_DIM || h > MAX_DIM) {
          const ratio = Math.min(MAX_DIM / w, Math.round(h * (MAX_DIM / w)));
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        canvasEl.width = w;
        canvasEl.height = h;

        if (!isFirst && video2.duration) {
          durationText.textContent = formatTime(video2.duration);
        }
        renderFrame();
      };
      videoEl.load();
      return objectUrl;
    }

    videoInput1.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        fileObj1 = e.target.files[0];
        fileName1.textContent = fileObj1.name;
        url1 = setupVideo(video1, fileObj1, canvas1, true);
        updatePlayButtonUI(false);
      }
    });

    videoInput2.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        fileObj2 = e.target.files[0];
        fileName2.textContent = fileObj2.name;
        url2 = setupVideo(video2, fileObj2, canvas2, false);
        updatePlayButtonUI(false);
      }
    });

    async function syncAudio() {
      if (!fileObj1 || !fileObj2) { alert("両方の動画を選択してください"); return; }
      syncStatus.textContent = "解析中...";
      syncStatus.style.color = "var(--text-sub)";

      setTimeout(async () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const fetchAudioFromFile = async (file) => {
            const buf = await file.arrayBuffer();
            return await audioCtx.decodeAudioData(buf);
          };

          const [buf1, buf2] = await Promise.all([fetchAudioFromFile(fileObj1), fetchAudioFromFile(fileObj2)]);
          const d1 = buf1.getChannelData(0);
          const d2 = buf2.getChannelData(0);
          const sampleRate = buf1.sampleRate;

          const targetDuration = Math.min(10, buf1.duration, buf2.duration);
          const samplesToAnalyze = Math.floor(targetDuration * sampleRate);
          const step = Math.floor(sampleRate / 2000);

          const s1 = [], s2 = [];
          let sum1 = 0, sum2 = 0;

          for (let i = 0; i < samplesToAnalyze; i += step) {
            const v1 = d1[i] || 0;
            const v2 = d2[i] || 0;
            s1.push(v1);
            s2.push(v2);
            sum1 += v1 * v1;
            sum2 += v2 * v2;
          }

          const maxShift = Math.floor(5 * (sampleRate / step));
          let bestOffset = 0;
          let maxCorrelation = -Infinity;

          for (let shift = -maxShift; shift <= maxShift; shift++) {
            let sum = 0;
            for (let i = 0; i < s2.length; i += 2) {
              const j = i + shift;
              if (j >= 0 && j < s1.length) {
                sum += s2[i] * s1[j];
              }
            }
            if (sum > maxCorrelation) {
              maxCorrelation = sum;
              bestOffset = shift;
            }
          }

          const normFactor = Math.sqrt(sum1 * sum2);
          const similarityRatio = normFactor > 0 ? (maxCorrelation / (normFactor / (s1.length / 100))) : 0;

          if (similarityRatio < 0.05 || maxCorrelation <= 0) {
            syncStatus.textContent = "❌ 音声が不一致です";
            syncStatus.style.color = "var(--accent-red)";
            audioOffset = 0;
            return;
          }

          audioOffset = (bestOffset * step) / sampleRate;
          syncStatus.textContent = `差: ${audioOffset > 0 ? '+' : ''}${audioOffset.toFixed(2)}s`;
          syncStatus.style.color = "var(--accent-green)";
          alignVideoTime();
        } catch (err) {
          syncStatus.textContent = "解析エラー";
          syncStatus.style.color = "var(--accent-red)";
        }
      }, 50);
    }

    function alignVideoTime() {
      let targetTime = video2.currentTime + audioOffset;
      if (targetTime >= 0 && targetTime <= video1.duration) {
        video1.currentTime = targetTime;
      }
    }

    syncAudioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      syncAudio();
    });
  </script>
</body>
